# Render Blueprint Specification for Smart Visual Shopping
# See https://render.com/docs/blueprint-spec for syntax reference.
version: "1"

services:
  # -------------------------------------------------------------
  # 1. Backend API (FastAPI + CLIP + FAISS Vector Search)
  # -------------------------------------------------------------
  - type: web
    name: smart-visual-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: starter # Starter plan recommended (2GB RAM for PyTorch CLIP inference)
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ML_SERVICE_URL
        value: local # Embedded mode: runs CLIP + FAISS inside backend container
      - key: DATABASE_URL
        value: sqlite:///./smart_visual_shopping.db
      - key: CORS_ORIGINS
        value: "*"
      - key: CLIP_MODEL_ID
        value: openai/clip-vit-base-patch32
      - key: CLIP_DEVICE
        value: cpu

  # -------------------------------------------------------------
  # 2. Frontend Application (Next.js 15)
  # -------------------------------------------------------------
  - type: web
    name: smart-visual-frontend
    runtime: node
    plan: free # Free tier supported
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: smart-visual-backend
          property: host
